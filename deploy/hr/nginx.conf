# 人力报告平台 — Nginx（网页与 Supabase 接口同源）

map $http_x_forwarded_proto $hr_fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # 存储服务单个文件上限 50 MB
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Supabase 接口（Studio 管理后台不对外开放）
    location ~ ^/(auth|rest|storage|functions)/v1/ {
        proxy_pass         http://api-gw:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $hr_fwd_proto;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location = /index.html { add_header Cache-Control "no-cache"; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }
}
