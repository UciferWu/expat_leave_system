# 员工休假系统 — Nginx
# 网页与 Supabase 接口同源，前端 config.js 直接使用 location.origin

# 前面有 HTTPS 网关时沿用网关传来的协议，否则使用本连接的协议
map $http_x_forwarded_proto $leave_fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # 附件单个最大 10 MB，留有余量
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Supabase 接口（Studio 管理后台不对外开放）
    location ~ ^/(auth|rest|storage|functions)/v1/ {
        proxy_pass         http://api-gw:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $leave_fwd_proto;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }

    # 页面和配置不缓存，更新后立即生效
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /config.js  { add_header Cache-Control "no-cache"; }

    location /vendor/ { add_header Cache-Control "public, max-age=604800"; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件一律拒绝
    location ~ /\. { deny all; }
}
