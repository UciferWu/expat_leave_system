# 员工休假系统：在官方 Supabase 自部署配置（self-hosted/v0.8.2）之上的改动
# Surcharge de la configuration officielle Supabase auto-hébergée
#
# 由 install.sh 复制到 /opt/leave/supabase/，并通过 .env 中的
# COMPOSE_FILE=docker-compose.yml:docker-compose.leave.yml 自动加载。
#
# 使用独立的项目名（leave）和容器名（leave-*），与同一台服务器上的其他 Supabase
# （例如人力报告平台）互不冲突。官方文件默认的项目名 supabase 和容器名 supabase-* 不再使用。

name: leave

services:

  db:
    container_name: leave-db
  auth:
    container_name: leave-auth
  rest:
    container_name: leave-rest
  storage:
    container_name: leave-storage
  imgproxy:
    container_name: leave-imgproxy
  meta:
    container_name: leave-meta
  studio:
    container_name: leave-studio
  api-gw:
    container_name: leave-envoy

  # 本系统不使用实时推送和连接池，关闭以节省内存
  # Non utilisés : désactivés pour économiser la mémoire
  realtime:
    container_name: leave-realtime
    profiles: ["disabled"]
  supavisor:
    container_name: leave-pooler
    profiles: ["disabled"]

  # 邮件提醒函数所需的配置（由 mail-setup.sh 写入 .env；留空则不发邮件）
  # Variables pour la fonction notify-leave (facultatives, voir mail-setup.sh)
  functions:
    container_name: leave-functions
    environment:
      MAIL_GRAPH_TENANT_ID: ${MAIL_GRAPH_TENANT_ID:-}
      MAIL_GRAPH_CLIENT_ID: ${MAIL_GRAPH_CLIENT_ID:-}
      MAIL_GRAPH_CLIENT_SECRET: ${MAIL_GRAPH_CLIENT_SECRET:-}
      MAIL_GRAPH_SENDER: ${MAIL_GRAPH_SENDER:-}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-}
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
      MAIL_SMTP_PASS: ${MAIL_SMTP_PASS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_URL: ${APP_URL:-}

  # 网页 + 接口统一入口：/ 为休假系统网页，/auth /rest /storage /functions 转发到 Supabase
  # Point d'entrée unique : le site et les API Supabase sur le même port
  web:
    container_name: leave-web
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${LEAVE_HTTP_PORT:-80}:80"
    depends_on:
      api-gw:
        condition: service_healthy
    volumes:
      - ./leave/site:/usr/share/nginx/html:ro
      - ./leave/nginx.conf:/etc/nginx/conf.d/default.conf:ro
